<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <meta name="description" content="Validation im Pflegealltag. Kurze Szenarien, einfache Formulierungen, Handlungsanweisungen, sofortige Auswertung – alles lokal im Browser.">
  <meta name="robots" content="index,follow">

  <title>Validation-Training – sicher reagieren im Pflegealltag</title>

  <style>
    :root{
      --bg:#ffffff; --fg:#000000; --muted:#f7f7f7;
      --accent:#007bff; --accent-hover:#0056b3;
      --warn:#ffefef; --border:#000000;
      --ok:#eaffea; --okb:#6bb36b;
      --meh:#fff7e6; --mehb:#d39b2e;
      --bad:#ffefef; --badb:#d46a6a;
    }
    body{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
      background:var(--bg); color:var(--fg);
      padding:20px; max-width:900px; margin:0 auto; line-height:1.55;
      position: relative;
    }
    h1{ margin:0 0 8px 0; }
    .muted{ opacity:.85; }
    .small{ font-size:14px; }
    .progress{ margin:16px 0 8px; font-size:14px; opacity:.85; }
    .card{
      border:1px solid var(--border); border-radius:10px; padding:16px; background:var(--muted);
    }
    .situation{ font-weight:700; margin:0 0 12px 0; }

    .option{
      background:#fff; border:1px solid #ddd; border-radius:10px;
      padding:12px; margin:8px 0; cursor:pointer; display:flex; gap:10px; align-items:flex-start;
      transition:border-color .2s ease, box-shadow .2s ease;
    }
    .option:hover{ border-color:var(--accent); box-shadow:0 1px 0 rgba(0,0,0,.04); }
    .option input{ margin-top:3px; }

    .controls{ display:flex; gap:12px; margin-top:16px; flex-wrap:wrap; }
    button{
      padding:12px 16px; font-size:16px; cursor:pointer; border:none; border-radius:8px;
      background:var(--accent); color:#fff; transition:background .2s ease;
    }
    button:hover{ background:var(--accent-hover); }
    button.secondary{ background:#e0e0e0; color:#000; }

    .unbeantwortet{ background-color:var(--warn); border:1px solid #f59a9a; }

    .explain{
      display:none;
      margin-top:12px;
      border-radius:10px;
      border:1px solid #ddd;
      padding:12px;
      background:#fff;
    }
    .explain h3{ margin:0 0 6px 0; font-size:16px; }
    .explain .tag{
      display:inline-block; font-size:12px; padding:4px 8px; border-radius:999px; margin-bottom:8px;
      border:1px solid #ddd; background:#fafafa;
    }
    .tag.ok{ background:var(--ok); border-color:var(--okb); }
    .tag.meh{ background:var(--meh); border-color:var(--mehb); }
    .tag.bad{ background:var(--bad); border-color:var(--badb); }

    .ergebnis{
      display:none; margin-top:24px; padding:16px; border:1px solid var(--border); border-radius:10px; background:#fff;
    }
    .badges{ display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
    .badge{ border:1px solid #ddd; border-radius:999px; padding:6px 10px; font-size:12px; background:#fafafa; }

    details{ margin-top:12px; }
    summary{ cursor:pointer; font-weight:700; }

    .review-item{
      border:1px solid #eee; border-radius:10px; padding:12px; margin:10px 0; background:#fafafa;
    }
    .review-item .qtitle{ font-weight:800; margin-bottom:6px; }

    /* =========================
       QR Floating Button + Modal
       ========================= */
    .qr-fab{
      position: fixed; top: 20px; right: 20px;
      background: #111; color:#fff;
      border-radius: 999px; padding:10px 12px;
      font-weight:700; font-size:14px; letter-spacing:.3px;
      border:1px solid rgba(0,0,0,.2); box-shadow:0 6px 20px rgba(0,0,0,.15);
      cursor:pointer; display:flex; align-items:center; gap:8px; z-index:1000;
    }
    .qr-fab:hover{ transform: translateY(-1px); }
    .qr-fab .dot{ width:6px; height:6px; background:#0ea5e9; border-radius:50%; }

    .qr-modal-backdrop{
      position:fixed; inset:0; background:rgba(0,0,0,.5);
      display:none; align-items:center; justify-content:center; z-index:1001;
    }
    .qr-modal{
      background:#fff; border-radius:16px; padding:20px;
      width:min(92vw, 420px); border:1px solid #e5e7eb;
      box-shadow:0 20px 60px rgba(0,0,0,.2);
    }
    .qr-modal header{
      display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;
    }
    .qr-modal h3{ margin:0; font-size:18px; }
    .qr-close{ background:transparent; border:none; font-size:20px; cursor:pointer; }
    .qr-canvas-wrap{
      display:flex; justify-content:center; align-items:center; padding:10px; background:#fff;
      border:1px solid #eee; border-radius:12px; margin:8px 0 6px;
    }

    @media (max-width:600px){
      body{ padding:12px; }
      button{ width:100%; }
      .controls{ gap:8px; }
      /* QR-Button auf kleinen Screens ausblenden */
      .qr-fab{ display:none; }
    }
  </style>
</head>
<body>

<!-- Floating QR-Button (wird auf Handy ausgeblendet) -->
<button class="qr-fab" id="qrFab" aria-haspopup="dialog" aria-controls="qrDialog" title="QR-Code öffnen">
  <span class="dot" aria-hidden="true"></span> QR öffnen
</button>

<!-- QR-Modal -->
<div class="qr-modal-backdrop" id="qrBackdrop" role="dialog" aria-modal="true" aria-labelledby="qrTitle">
  <div class="qr-modal" id="qrDialog">
    <header>
      <h3 id="qrTitle">Seite schnell öffnen</h3>
      <button class="qr-close" id="qrClose" aria-label="Schließen">×</button>
    </header>
    <div class="qr-canvas-wrap">
      <div id="qrCanvas" aria-label="QR-Code dieser Seite"></div>
    </div>
  </div>
</div>

<h1>Selbsttest: Validation im Pflegealltag</h1>
<p class="muted small">
  Wähle die Antwort, die am besten passt. Danach siehst du eine kurze Erklärung plus „Parallel tun“.
  <br><em>Hinweis: Alles läuft nur im Browser. Es werden keine Daten gespeichert.</em>
</p>

<div class="progress" id="progress">Frage 1 von 12</div>

<div class="card" id="frageCard">
  <div class="situation" id="situationText"></div>
  <form id="formAntworten" aria-labelledby="situationText"></form>

  <div class="explain" id="explainBox" aria-live="polite">
    <div class="tag" id="explainTag"></div>
    <h3>Kurz erklärt</h3>
    <div id="explainText"></div>
  </div>
</div>

<div class="controls">
  <button class="secondary" id="btnZurueck" type="button">Zurück</button>
  <button id="btnWeiter" type="button">Weiter</button>
  <button id="btnAuswerten" type="button" style="display:none;">Auswerten</button>
</div>

<div class="ergebnis" id="ergebnisBox"></div>

<!-- QR Bibliothek via CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>
/* =========================
   Hilfsfunktionen
   ========================= */
function shuffle(array){
  for(let i=array.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [array[i],array[j]] = [array[j],array[i]];
  }
  return array;
}

/* =========================
   Fragen (PFA-tauglich)
   ========================= */
const fragen = [
  {
    situation: "Frau S. steht an der Tür: „Ich muss nach Hause, meine Kinder warten!“",
    handlung: "Ruhig daneben stehen, auf Augenhöhe gehen, Abstand lassen. Ruhige Stimme. Nicht festhalten – eher begleiten.",
    optionen: [
      { text:"„Ihre Kinder sind längst erwachsen. Sie wohnen doch hier.“", score:0,
        feedback:"Du korrigierst. Das macht oft mehr Stress, weil das Gefühl nicht gesehen wird." },
      { text:"„Sie müssen nicht nach Hause. Setzen Sie sich jetzt hin.“", score:0,
        feedback:"Befehl ohne Verstehen. Unruhe wird eher stärker." },
      { text:"„Sie wollen nach Hause. Das macht Sie gerade unruhig. Ich bleibe kurz bei Ihnen.“", score:2,
        feedback:"Du spiegelst kurz und gibst Sicherheit. Kein Streit, erst beruhigen." },
      { text:"„Wenn Sie weiter aufstehen, stürzen Sie.“", score:0,
        feedback:"Sicherheit ist wichtig – aber als erstes braucht sie Beruhigung und Kontakt." }
    ],
    merksatz: "Erst beruhigen, dann lenken."
  },

  {
    situation: "Herr B. sagt: „Da war eben ein Mann im Zimmer!“",
    handlung: "Nicht lachen, nicht wegwischen. Ruhig bleiben, Blickkontakt anbieten. Licht an / Tür offen, wenn das beruhigt.",
    optionen: [
      { text:"„Da war niemand. Sie bilden sich das ein.“", score:0,
        feedback:"Abwertung/Realitätsstreit. Angst steigt oft." },
      { text:"„Ich rufe sofort die Polizei!“", score:0,
        feedback:"Kann Angst verstärken. Erst beruhigen, dann prüfen." },
      { text:"„Das hat Sie erschreckt. Ich bleibe kurz bei Ihnen. Wir schauen zusammen.“", score:2,
        feedback:"Du nimmst Angst ernst und gibst Sicherheit." },
      { text:"„Sie müssen einfach schlafen.“", score:0,
        feedback:"Wegschieben. Der Mensch bleibt unsicher." }
    ],
    merksatz: "Sicherheit schlägt Diskussion."
  },

  {
    situation: "Herr P. hält seine Geldbörse fest: „Die wollen mir was wegnehmen!“",
    handlung: "Hände sichtbar, nicht nach der Börse greifen. Ruhig sprechen, kurze Sätze. Wahlmöglichkeiten anbieten.",
    optionen: [
      { text:"„Sie wollen sicher sein, dass alles da ist. Wollen wir zusammen nachsehen?“", score:2,
        feedback:"Top: Bedürfnis (Sicherheit) trifft. Du bietest Hilfe an." },
      { text:"„Wir können kurz prüfen: Geldbörse, Schlüssel, Handy. Sie sagen Stopp, wenn’s passt.“", score:1,
        feedback:"Gut: gibt Kontrolle zurück. Noch besser: kurz Gefühl benennen („macht Sie unruhig“)." },
      { text:"„Niemand nimmt Ihnen was weg. Beruhigen Sie sich.“", score:0,
        feedback:"Klingt logisch, fühlt sich aber wie Wegwischen an." },
      { text:"„Das ist Unsinn.“", score:0,
        feedback:"Abwertung. Misstrauen wird oft stärker." }
    ],
    merksatz: "Choice beruhigt."
  },

  {
    situation: "Frau M. weint: „Wo ist meine Mutter? Die muss mich abholen.“",
    handlung: "Hinsetzen/Hocke, auf Augenhöhe. Taschentuch anbieten. Ruhige Stimme. Nicht korrigieren.",
    optionen: [
      { text:"„Sie vermissen Ihre Mutter. Das ist gerade traurig. Ich bin kurz bei Ihnen.“", score:2,
        feedback:"Top: Gefühl trifft + Kontakt. Das beruhigt meist schnell." },
      { text:"„Wollen wir zusammen einen Tee trinken und kurz warten?“", score:1,
        feedback:"Okay: beruhigt und gibt Struktur. Noch besser: erst Gefühl benennen." },
      { text:"„Ihre Mutter lebt nicht mehr.“", score:0,
        feedback:"Kann wie eine neue harte Nachricht wirken und Trauer verstärken." },
      { text:"„Jetzt hören Sie auf zu weinen.“", score:0,
        feedback:"Abwertung. Beziehung leidet, Stress steigt." }
    ],
    merksatz: "Erst begleiten, dann lenken."
  },

  {
    situation: "Frau L. fragt zum fünften Mal: „Wann gibt’s denn endlich Mittagessen?“",
    handlung: "Ruhig bleiben. Nicht „genervt“ zeigen. Visuellen Hinweis nutzen (Uhr/Plan/Zettel).",
    optionen: [
      { text:"„Das habe ich Ihnen doch gerade schon gesagt!“", score:0,
        feedback:"Klingt genervt. Das macht Scham – und dann wird’s oft schlimmer." },
      { text:"„Sie fragen ständig das Gleiche. Das nervt.“", score:0,
        feedback:"Beziehungsschaden. Unruhe nimmt zu." },
      { text:"„Sie haben Hunger und warten. Es gibt um 12 Uhr. Ich zeig’s kurz am Plan.“", score:2,
        feedback:"Gefühl + klare Orientierung. Du stützt statt zu tadeln." },
      { text:"„Keine Ahnung, ich hab keine Zeit.“", score:0,
        feedback:"Unsicherheit steigt. Frage kommt dann oft wieder." }
    ],
    merksatz: "Wiederholung ist Symptom."
  },

  {
    situation: "Frau R. ruft: „Meine Handtasche ist weg! Jemand hat sie geklaut!“",
    handlung: "Stimme runter, nicht diskutieren. Erst beruhigen. Dann gemeinsam suchen – Schritt für Schritt, langsam.",
    optionen: [
      { text:"„Sie sind ganz aufgeregt. Die Tasche ist wichtig. Wir suchen zusammen.“", score:2,
        feedback:"Top: Gefühl + Bedeutung + Hilfe. Das bringt Ruhe." },
      { text:"„Wo war die Tasche zuletzt? Wir suchen jetzt.“", score:1,
        feedback:"Okay lösungsorientiert. Noch besser: ein Satz zum Gefühl davor." },
      { text:"„Sie verlegen die dauernd. Das ist nichts Neues.“", score:0,
        feedback:"Beschämt. Das macht’s meist schlimmer." },
      { text:"„Wenn Sie weiter so schreien, muss ich Sie beruhigen.“", score:0,
        feedback:"Drohung. Eskalationsrisiko." }
    ],
    merksatz: "Ruhig → gemeinsam → Schritt für Schritt."
  },

  {
    situation: "Herr G. sagt: „Ich bin hier falsch. Ich muss in mein Zimmer!“ (Er ist bereits dort.)",
    handlung: "Nicht korrigieren. Ruhig bleiben. Einen Anker anbieten (Foto, Lieblingsdecke, Namensschild).",
    optionen: [
      { text:"„Sie sind doch in Ihrem Zimmer! Sehen Sie das nicht?“", score:0,
        feedback:"Korrigiert. Macht oft mehr Verwirrung/Ärger." },
      { text:"„Okay, dann gehen wir halt.“", score:0,
        feedback:"Kann Unruhe verstärken. Erst Bedarf klären." },
      { text:"„Hier fühlt es sich gerade nicht richtig an. Was fehlt Ihnen, damit es passt?“", score:2,
        feedback:"Du nimmst das Gefühl ernst und suchst einen Anker." },
      { text:"„Sie müssen jetzt bleiben.“", score:0,
        feedback:"Zwangsignal. Beziehung leidet." }
    ],
    merksatz: "Nicht streiten – ankommen lassen."
  },

  {
    situation: "Frau H. schiebt den Teller weg: „Das Essen ist vergiftet!“",
    handlung: "Ruhig bleiben, nicht lachen. Choice geben (Tee/Joghurt/neu servieren). Kleine Schritte.",
    optionen: [
      { text:"„Das macht Ihnen Angst. Sie wollen sicher sein. Wollen wir was anderes holen?“", score:2,
        feedback:"Top: Gefühl + Bedürfnis + Lösung in kleinen Schritten." },
      { text:"„Wollen Sie erst einen Tee? Oder wir holen etwas, das Sie selbst auswählen?“", score:1,
        feedback:"Gut: Choice. Noch besser: vorher kurz Gefühl benennen." },
      { text:"„Das stimmt nicht. Essen Sie jetzt.“", score:0,
        feedback:"Druck + Realitätsstreit. Verweigerung wird oft stärker." },
      { text:"„Dann essen Sie halt nichts.“", score:0,
        feedback:"Lässt Angst offen. Kann problematisch werden." }
    ],
    merksatz: "Klein anfangen, nicht drücken."
  },

  {
    situation: "Herr T. sagt: „Ich muss gleich zur Schule, sonst gibt’s Ärger.“",
    handlung: "Ruhige Stimme. Nicht korrigieren. Umleiten über „vorbereiten / prüfen / warten“.",
    optionen: [
      { text:"„Sie gehen doch nicht mehr zur Schule.“", score:0,
        feedback:"Korrigiert. Kann beschämen oder provozieren." },
      { text:"„Okay, dann los!“", score:0,
        feedback:"Ungefiltert mitgehen kann riskant sein." },
      { text:"„Sie wollen keinen Ärger. Okay. Wir machen uns kurz bereit und schauen, ob alles stimmt.“", score:2,
        feedback:"Gefühl/Bedeutung + strukturierender Umleiter. Sehr praktikabel." },
      { text:"„Setzen Sie sich. Punkt.“", score:0,
        feedback:"Zwangsignal. Widerstand steigt." }
    ],
    merksatz: "„Vorbereiten“ ist ein guter Umleiter."
  },

  {
    situation: "Frau E. sagt leise: „Alle lassen mich allein.“",
    handlung: "Hinsetzen, ruhige Nähe. Kurzer Kontakt (Hand anbieten, wenn passend). Nicht sofort „aktivieren“.",
    optionen: [
      { text:"„Das fühlt sich einsam an. Ich setze mich kurz zu Ihnen.“", score:2,
        feedback:"Top: Gefühl + Kontakt." },
      { text:"„Ach was, wir sind doch da.“", score:1,
        feedback:"Okay gemeint – kann aber wie Wegwischen wirken." },
      { text:"„Das stimmt nicht. Gestern war doch Besuch.“", score:0,
        feedback:"Fakten helfen hier kaum. Gefühl bleibt." },
      { text:"„Dann gehen Sie halt raus unter Leute.“", score:0,
        feedback:"Ratschlag ohne Beziehung. Meist nicht hilfreich." }
    ],
    merksatz: "Erst Beziehung, dann Aktion."
  },

  {
    situation: "Spätnachmittag: Frau J. läuft hin und her: „Hier stimmt was nicht… irgendwas ist falsch!“",
    handlung: "Reize senken (leiser, weniger Leute). Ruhig begleiten. Ruhigen Platz anbieten. Setzen/atmen.",
    optionen: [
      { text:"„Nein, alles ist normal. Setzen Sie sich.“", score:0,
        feedback:"Wegwischen + Befehl. Unruhe bleibt." },
      { text:"„Was ist denn falsch? Sagen Sie es endlich!“", score:0,
        feedback:"Druck. Kann überfordern." },
      { text:"„Sie wirken angespannt. Komm, wir gehen kurz an einen ruhigen Platz.“", score:2,
        feedback:"Gefühl + einfache Handlung. Das bringt Regulation." },
      { text:"„Wenn Sie nicht aufhören, rufe ich jemanden.“", score:0,
        feedback:"Drohung. Eskalationsrisiko." }
    ],
    merksatz: "Ruhig machen, dann weiter."
  },

  {
    situation: "Frau K. sagt: „Die Jacke ist nicht meine. Die haben die vertauscht.“",
    handlung: "Nicht diskutieren. Gemeinsam kurz prüfen (Etikett/Name). Wenn’s nicht klappt: beruhigen & ankern (eigene Jacke zeigen).",
    optionen: [
      { text:"„Das fühlt sich falsch an. Wollen wir kurz zusammen schauen, welche Ihre ist?“", score:2,
        feedback:"Top: Gefühl + gemeinsames Prüfen." },
      { text:"„Hier steht Ihr Name. Das ist Ihre Jacke.“", score:1,
        feedback:"Okay, wenn ruhig gesagt. Manchmal reicht’s – manchmal nicht." },
      { text:"„Das ist doch Quatsch. Sie sehen doch, dass das Ihre ist.“", score:0,
        feedback:"Abwertung. Macht’s häufig schlimmer." },
      { text:"„Sie machen immer Theater.“", score:0,
        feedback:"Beziehungsschaden. Unruhe steigt." }
    ],
    merksatz: "Kurz prüfen – wenn nicht, beruhigen & ankern."
  }
];

/* =========================
   Zustand
   ========================= */
let index = 0;
fragen.forEach(f => f._shuffled = null);

const selections = new Array(fragen.length).fill(null); // index in gemischter Liste
const explanationShown = new Array(fragen.length).fill(false);

let maxScore = fragen.reduce((acc, f) => acc + Math.max(...f.optionen.map(o=>o.score)), 0);

/* =========================
   DOM
   ========================= */
const progressEl   = document.getElementById("progress");
const cardEl       = document.getElementById("frageCard");
const formEl       = document.getElementById("formAntworten");
const situationEl  = document.getElementById("situationText");

const explainBox   = document.getElementById("explainBox");
const explainTag   = document.getElementById("explainTag");
const explainText  = document.getElementById("explainText");

const btnBack      = document.getElementById("btnZurueck");
const btnNext      = document.getElementById("btnWeiter");
const btnFinish    = document.getElementById("btnAuswerten");
const resultEl     = document.getElementById("ergebnisBox");

function currentSelectedIndex(){
  const checked = formEl.querySelector('input[type="radio"]:checked');
  if(!checked) return null;
  return parseInt(checked.value,10);
}
function setExplainVisible(visible){
  explainBox.style.display = visible ? "block" : "none";
}
function lockOptions(locked){
  const inputs = formEl.querySelectorAll('input[type="radio"]');
  inputs.forEach(i => i.disabled = locked);
}
function tagForScore(score){
  if(score >= 2) return { cls:"ok", text:"Sehr passend" };
  if(score === 1) return { cls:"meh", text:"Okay" };
  return { cls:"bad", text:"Nicht passend" };
}
function showExplanationForChoice(frage, chosenOpt){
  const t = tagForScore(chosenOpt.score);
  explainTag.className = `tag ${t.cls}`;
  explainTag.textContent = t.text;

  explainText.innerHTML = `
    <p style="margin:0;"><strong>Warum?</strong> ${chosenOpt.feedback}</p>
    <p style="margin:10px 0 0 0;"><strong>Merksatz:</strong> ${frage.merksatz}</p>
    <p style="margin:10px 0 0 0;"><strong>Parallel tun:</strong> ${frage.handlung}</p>
  `;
}

function render(){
  progressEl.textContent = `Frage ${index + 1} von ${fragen.length}`;
  const f = fragen[index];
  situationEl.textContent = f.situation;

  if(!f._shuffled){
    f._shuffled = shuffle([...f.optionen]);
  }
  const options = f._shuffled;

  formEl.innerHTML = "";
  cardEl.classList.remove("unbeantwortet");

  options.forEach((opt, i) => {
    const id = `opt_${index}_${i}`;
    const label = document.createElement("label");
    label.className = "option";
    label.htmlFor = id;

    const input = document.createElement("input");
    input.type = "radio";
    input.name = `frage_${index}`;
    input.id = id;
    input.value = i;

    if(selections[index] === i){
      input.checked = true;
    }

    const text = document.createElement("div");
    text.textContent = opt.text;

    label.appendChild(input);
    label.appendChild(text);
    formEl.appendChild(label);
  });

  if(explanationShown[index] && selections[index] !== null){
    const chosen = f._shuffled[selections[index]];
    showExplanationForChoice(f, chosen);
    setExplainVisible(true);
    lockOptions(true);
  } else {
    setExplainVisible(false);
    lockOptions(false);
  }

  btnBack.style.display = index === 0 ? "none" : "inline-block";
  btnNext.style.display = index < fragen.length - 1 ? "inline-block" : "none";
  btnFinish.style.display = index === fragen.length - 1 ? "inline-block" : "none";

  if(index < fragen.length - 1){
    btnNext.textContent = (!explanationShown[index] && selections[index] !== null) ? "Weiter (Erklärung)" : "Weiter";
  } else {
    btnFinish.textContent = explanationShown[index] ? "Auswerten" : "Auswerten (Erklärung)";
  }
}

btnNext.addEventListener("click", () => {
  const selIdx = currentSelectedIndex();
  if(selIdx === null && selections[index] === null){
    cardEl.classList.add("unbeantwortet");
    return;
  }
  cardEl.classList.remove("unbeantwortet");

  if(!explanationShown[index]){
    const f = fragen[index];
    const effectiveIdx = selIdx !== null ? selIdx : selections[index];
    selections[index] = effectiveIdx;

    const chosen = f._shuffled[effectiveIdx];
    showExplanationForChoice(f, chosen);
    setExplainVisible(true);
    explanationShown[index] = true;
    lockOptions(true);

    btnNext.textContent = "Weiter";
    return;
  }

  if(index < fragen.length - 1){
    index++;
    render();
  }
});

btnBack.addEventListener("click", () => {
  if(index > 0) index--;
  render();
});

btnFinish.addEventListener("click", () => {
  const selIdx = currentSelectedIndex();
  if(selIdx === null && selections[index] === null){
    cardEl.classList.add("unbeantwortet");
    return;
  }
  cardEl.classList.remove("unbeantwortet");

  const f = fragen[index];
  const effectiveIdx = selIdx !== null ? selIdx : selections[index];
  selections[index] = effectiveIdx;

  if(!explanationShown[index]){
    const chosen = f._shuffled[effectiveIdx];
    showExplanationForChoice(f, chosen);
    setExplainVisible(true);
    explanationShown[index] = true;
    lockOptions(true);
    btnFinish.textContent = "Auswerten";
    return;
  }

  let totalScore = 0;
  for(let q=0; q<fragen.length; q++){
    const fr = fragen[q];
    const picked = fr._shuffled[selections[q]];
    totalScore += picked.score;
  }
  const perc = Math.round((totalScore / maxScore) * 100);

  let level = "";
  let impuls = "";
  if(perc >= 80){
    level = "Sehr gut im Alltag nutzbar";
    impuls = "Du triffst oft Gefühl und gibst Sicherheit. In Stressmomenten: Stimme runter, Satz kurz, dann eine kleine Handlung anbieten.";
  } else if(perc >= 55){
    level = "Gute Basis – mit Luft nach oben";
    impuls = "Du bist häufig nah dran. Tipp: Fast immer zuerst ein Gefühl in einfachen Worten („macht unruhig/traurig/erschrocken“), dann Lösung.";
  } else {
    level = "Noch Übung nötig";
    impuls = "Du rutschst noch öfter ins Korrigieren oder Anweisen. Trick: Erst Kontakt + Gefühl. Dann eine kleine, einfache Handlung anbieten.";
  }

  let reviewHtml = "";
  for(let q=0; q<fragen.length; q++){
    const fr = fragen[q];
    const picked = fr._shuffled[selections[q]];
    const t = tagForScore(picked.score);

    reviewHtml += `
      <div class="review-item">
        <div class="qtitle">Frage ${q+1}</div>
        <div class="small muted">${fr.situation}</div>
        <div style="margin-top:10px;">
          <span class="tag ${t.cls}">${t.text}</span>
          <div style="margin-top:8px;"><strong>Deine Antwort:</strong> ${picked.text}</div>
          <div style="margin-top:6px;"><strong>Warum?</strong> ${picked.feedback}</div>
          <div class="small" style="margin-top:8px;"><strong>Merksatz:</strong> ${fr.merksatz}</div>
          <div class="small" style="margin-top:6px;"><strong>Parallel tun:</strong> ${fr.handlung}</div>
        </div>
      </div>
    `;
  }

  resultEl.innerHTML = `
    <h2>Dein Ergebnis</h2>
    <p><strong>Punkte:</strong> ${totalScore} / ${maxScore} (${perc}%)</p>
    <div class="badges">
      <span class="badge">Einstufung: ${level}</span>
      <span class="badge">Merkschema: Gefühl → Sicherheit → kleine Handlung</span>
      <span class="badge">Vermeiden: Korrigieren, Drohen, Genervt klingen</span>
    </div>
    <p style="margin-top:12px;"><strong>Praxis-Impuls:</strong> ${impuls}</p>

    <details>
      <summary>Antworten & Erklärungen (Nachlesen)</summary>
      ${reviewHtml}
    </details>

    <div class="controls" style="margin-top:10px;">
      <button class="secondary" type="button" id="btnNeu">Test neu starten</button>
    </div>
  `;
  resultEl.style.display = "block";
  resultEl.scrollIntoView({ behavior:"smooth", block:"start" });

  document.getElementById("btnNeu").addEventListener("click", () => location.reload());
});

// Start
render();

/* =========================
   QR Code minimal (Button + Modal)
   ========================= */
const qrFab      = document.getElementById('qrFab');
const qrBackdrop = document.getElementById('qrBackdrop');
const qrClose    = document.getElementById('qrClose');
const qrCanvas   = document.getElementById('qrCanvas');

let qrMade = false;

function openQR(){
  qrBackdrop.style.display = 'flex';
  if(!qrMade){
    // Wichtig: Canvas vor erneutem Erzeugen leer lassen
    qrCanvas.innerHTML = '';
    new QRCode(qrCanvas, {
      text: window.location.href,
      width: 220,
      height: 220,
      correctLevel: QRCode.CorrectLevel.H
    });
    qrMade = true;
  }
}
function closeQR(){
  qrBackdrop.style.display = 'none';
}

qrFab.addEventListener('click', openQR);
qrClose.addEventListener('click', closeQR);
qrBackdrop.addEventListener('click', (e)=>{ if(e.target === qrBackdrop) closeQR(); });
window.addEventListener('keydown', (e)=>{ if(e.key === 'Escape') closeQR(); });
</script>
