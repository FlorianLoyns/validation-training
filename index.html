<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <meta name="description" content="Validation im Pflegealltag. Kurze Szenarien, einfache Formulierungen, Handlungsanweisungen, sofortige Auswertung – lokal im Browser.">
  <meta name="robots" content="index,follow">

  <title>Validation-Training – sicher reagieren im Pflegealltag</title>

  <style>
    :root{
      --bg:#ffffff; --fg:#000000; --muted:#f7f7f7;
      --accent:#007bff; --accent-hover:#0056b3;
      --warn:#ffefef; --border:#000000;
      --ok:#eaffea; --okb:#6bb36b;
      --meh:#fff7e6; --mehb:#d39b2e;
      --bad:#ffefef; --badb:#d46a6a;
    }
    body{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
      background:var(--bg); color:var(--fg);
      padding:20px; max-width:900px; margin:0 auto; line-height:1.55;
      position: relative;
    }
    h1{ margin:0 0 8px 0; }
    .muted{ opacity:.85; }
    .small{ font-size:14px; }
    .progress{ margin:16px 0 8px; font-size:14px; opacity:.85; }
    .card{
      border:1px solid var(--border); border-radius:10px; padding:16px; background:var(--muted);
    }
    .situation{ font-weight:700; margin:0 0 12px 0; outline:none; }

    .option{
      background:#fff; border:1px solid #ddd; border-radius:10px;
      padding:12px; margin:8px 0; cursor:pointer; display:flex; gap:10px; align-items:flex-start;
      transition:border-color .2s ease, box-shadow .2s ease;
    }
    .option:hover{ border-color:var(--accent); box-shadow:0 1px 0 rgba(0,0,0,.04); }
    .option input{ margin-top:3px; }

    .controls{ display:flex; gap:12px; margin-top:16px; flex-wrap:wrap; }
    button{
      padding:12px 16px; font-size:16px; cursor:pointer; border:none; border-radius:8px;
      background:var(--accent); color:#fff; transition:background .2s ease;
    }
    button:hover{ background:var(--accent-hover); }
    button.secondary{ background:#e0e0e0; color:#000; }

    .unbeantwortet{ background-color:var(--warn); border:1px solid #f59a9a; }

    .explain{
      display:none;
      margin-top:12px;
      border-radius:10px;
      border:1px solid #ddd;
      padding:12px;
      background:#fff;
    }
    .explain h3{ margin:0 0 6px 0; font-size:16px; }
    .explain .tag{
      display:inline-block; font-size:12px; padding:4px 8px; border-radius:999px; margin-bottom:8px;
      border:1px solid #ddd; background:#fafafa;
    }
    .tag.ok{ background:var(--ok); border-color:var(--okb); }
    .tag.meh{ background:var(--meh); border-color:var(--mehb); }
    .tag.bad{ background:var(--bad); border-color:var(--badb); }

    .ergebnis{
      display:none; margin-top:24px; padding:16px; border:1px solid var(--border); border-radius:10px; background:#fff;
    }

    details{ margin-top:12px; }
    summary{ cursor:pointer; font-weight:700; }

    .review-item{
      border:1px solid #eee; border-radius:10px; padding:12px; margin:10px 0; background:#fafafa;
    }
    .review-item .qtitle{ font-weight:800; margin-bottom:6px; }

    /* QR FAB + Modal (wie dein Original) */
    .qr-fab{
      position: fixed; top: 20px; right: 20px;
      background: #111; color:#fff;
      border-radius: 999px; padding:10px 12px;
      font-weight:700; font-size:14px; letter-spacing:.3px;
      border:1px solid rgba(0,0,0,.2); box-shadow:0 6px 20px rgba(0,0,0,.15);
      cursor:pointer; display:flex; align-items:center; gap:8px; z-index:1000;
    }
    .qr-fab:hover{ transform: translateY(-1px); }
    .qr-fab .dot{ width:6px; height:6px; background:#0ea5e9; border-radius:50%; }

    .qr-modal-backdrop{
      position:fixed; inset:0; background:rgba(0,0,0,.5);
      display:none; align-items:center; justify-content:center; z-index:1001;
    }
    .qr-modal{
      background:#fff; border-radius:16px; padding:20px;
      width:min(92vw, 420px); border:1px solid #e5e7eb;
      box-shadow:0 20px 60px rgba(0,0,0,.2);
    }
    .qr-modal header{
      display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;
    }
    .qr-modal h3{ margin:0; font-size:18px; }
    .qr-close{ background:transparent; border:none; font-size:20px; cursor:pointer; color:#000; }
    .qr-canvas-wrap{
      display:flex; justify-content:center; align-items:center; padding:10px; background:#fff;
      border:1px solid #eee; border-radius:12px; margin:8px 0 6px;
    }

    @media (max-width:600px){
      body{ padding:12px; }
      button{ width:100%; }
      .controls{ gap:8px; }
      .qr-fab{ display:none; }
    }
  </style>
</head>
<body>

<button class="qr-fab" id="qrFab" aria-haspopup="dialog" aria-controls="qrDialog" title="QR-Code oeffnen">

</button>

<div class="qr-modal-backdrop" id="qrBackdrop" role="dialog" aria-modal="true" aria-labelledby="qrTitle">

</div>

<h1>Selbsttest: Validation im Pflegealltag</h1>
<p class="muted small">
  Waehle die Antwort, die am besten passt. Danach siehst du eine kurze Erklaerung.
  <br><em>Hinweis: Auswertung laeuft lokal im Browser. Es werden keine Eingaben gespeichert.</em>
</p>

<div class="progress" id="progress">Frage 1 von 12</div>

<div class="card" id="frageCard">
  <div class="situation" id="situationText" tabindex="-1"></div>
  <form id="formAntworten" aria-labelledby="situationText"></form>

  <div class="explain" id="explainBox" aria-live="polite">
    <div class="tag" id="explainTag"></div>
    <h3>Warum?</h3>
    <div id="explainText"></div>
  </div>
</div>

<div class="controls">
  <button class="secondary" id="btnZurueck" type="button">Zurueck</button>
  <button id="btnWeiter" type="button">Erklaerung anzeigen</button>
  <button id="btnAuswerten" type="button" style="display:none;">Erklaerung anzeigen</button>
</div>

<div class="ergebnis" id="ergebnisBox"></div>

function shuffle(array){
  for(var i=array.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var temp = array[i];
    array[i] = array[j];
    array[j] = temp;
  }
  return array;
}

var index = 0;
var selections = [];
var explanationShown = [];
var maxScore = 0;

for (var i = 0; i < fragen.length; i++) {
  selections.push(null);
  explanationShown.push(false);

  var maxInQuestion = 0;
  for (var j = 0; j < fragen[i].optionen.length; j++) {
    if (fragen[i].optionen[j].score > maxInQuestion) {
      maxInQuestion = fragen[i].optionen[j].score;
    }
  }
  maxScore += maxInQuestion;
}

var progressEl = document.getElementById("progress");
var cardEl = document.getElementById("frageCard");
var formEl = document.getElementById("formAntworten");
var situationEl = document.getElementById("situationText");
var explainBox = document.getElementById("explainBox");
var explainTag = document.getElementById("explainTag");
var explainText = document.getElementById("explainText");
var btnBack = document.getElementById("btnZurueck");
var btnNext = document.getElementById("btnWeiter");
var btnFinish = document.getElementById("btnAuswerten");
var resultEl = document.getElementById("ergebnisBox");

function currentSelectedIndex() {
  var checked = formEl.querySelector('input[type="radio"]:checked');
  if (!checked) return null;
  return parseInt(checked.value, 10);
}

function setExplainVisible(visible) {
  explainBox.style.display = visible ? "block" : "none";
}

function lockOptions(locked) {
  var inputs = formEl.querySelectorAll('input[type="radio"]');
  for (var i = 0; i < inputs.length; i++) inputs[i].disabled = locked;
}

function tagForScore(score) {
  if (score >= 2) return { cls: "ok", text: "Gut!" };
  if (score === 1) return { cls: "meh", text: "Geht so" };
  return { cls: "bad", text: "Nicht gut" };
}

function ensureMehHint(feedbackText) {
  if (!feedbackText) return "";
  if (/noch besser/i.test(feedbackText)) return feedbackText;
  return feedbackText + " Noch besser: erst kurz das Gefuehl benennen (z.B. 'Das macht Ihnen Angst / Sie wollen sicher sein.'), dann erst die Loesung.";
}

function showExplanationForChoice(frage, chosenOpt) {
  var t = tagForScore(chosenOpt.score);
  explainTag.className = "tag " + t.cls;
  explainTag.textContent = t.text;

  explainText.innerHTML = "";

  var fb = chosenOpt.feedback;
  if (chosenOpt.score === 1) fb = ensureMehHint(fb);

  var p1 = document.createElement("p");
  p1.style.margin = "0";
  p1.textContent = fb;

  var p2 = document.createElement("p");
  p2.style.margin = "10px 0 0 0";
  p2.innerHTML = "<strong>Merke:</strong> " + frage.merksatz;

  var p3 = document.createElement("p");
  p3.style.margin = "10px 0 0 0";
  p3.innerHTML = "<strong>Das kannst du tun:</strong> " + frage.handlung;

  explainText.appendChild(p1);
  explainText.appendChild(p2);
  explainText.appendChild(p3);
}

function updateButtons() {
  var isLast = index === fragen.length - 1;

  btnBack.style.display = index === 0 ? "none" : "inline-block";
  btnNext.style.display = isLast ? "none" : "inline-block";
  btnFinish.style.display = isLast ? "inline-block" : "none";

  var explained = explanationShown[index];
  if (!isLast) {
    btnNext.textContent = explained ? "Naechste Frage" : "Erklaerung anzeigen";
  } else {
    btnFinish.textContent = explained ? "Auswerten" : "Erklaerung anzeigen";
  }
}

function render() {
  progressEl.textContent = "Frage " + (index + 1) + " von " + fragen.length;
  var f = fragen[index];
  situationEl.textContent = f.situation;

  // Fokus auf Situation
  try { situationEl.focus(); } catch(e){}

  if (!f._shuffled) {
    var copy = [];
    for (var i = 0; i < f.optionen.length; i++) copy.push(f.optionen[i]);
    f._shuffled = shuffle(copy);
  }
  var options = f._shuffled;

  formEl.innerHTML = "";
  cardEl.classList.remove("unbeantwortet");

  for (var i = 0; i < options.length; i++) {
    var opt = options[i];
    var id = "opt_" + index + "_" + i;

    var label = document.createElement("label");
    label.className = "option";
    label.htmlFor = id;

    var input = document.createElement("input");
    input.type = "radio";
    input.name = "frage_" + index;
    input.id = id;
    input.value = i;

    if (selections[index] === i) input.checked = true;

    var text = document.createElement("div");
    text.textContent = opt.text;

    label.appendChild(input);
    label.appendChild(text);
    formEl.appendChild(label);
  }

  if (explanationShown[index] && selections[index] !== null) {
    var chosen = f._shuffled[selections[index]];
    showExplanationForChoice(f, chosen);
    setExplainVisible(true);
    lockOptions(true);
  } else {
    setExplainVisible(false);
    lockOptions(false);
  }

  updateButtons();
}

function requireSelectionOrStored() {
  var selIdx = currentSelectedIndex();
  if (selIdx === null && selections[index] === null) {
    cardEl.classList.add("unbeantwortet");
    return null;
  }
  cardEl.classList.remove("unbeantwortet");
  return selIdx;
}

function showExplanationStep(selIdxMaybe) {
  var f = fragen[index];
  var effectiveIdx = (selIdxMaybe !== null) ? selIdxMaybe : selections[index];
  selections[index] = effectiveIdx;

  var chosen = f._shuffled[effectiveIdx];
  showExplanationForChoice(f, chosen);
  setExplainVisible(true);
  explanationShown[index] = true;
  lockOptions(true);
  updateButtons();
}

btnNext.addEventListener("click", function() {
  var selIdx = requireSelectionOrStored();
  if (selIdx === null && selections[index] === null) return;

  if (!explanationShown[index]) {
    showExplanationStep(selIdx);
    return;
  }

  if (index < fragen.length - 1) {
    index++;
    render();
  }
});

btnBack.addEventListener("click", function() {
  if (index > 0) index--;
  render();
});

btnFinish.addEventListener("click", function() {
  var selIdx = requireSelectionOrStored();
  if (selIdx === null && selections[index] === null) return;

  if (!explanationShown[index]) {
    showExplanationStep(selIdx);
    return;
  }

  // Auswertung + Ampel
  var totalScore = 0;
  var countOk = 0, countMeh = 0, countBad = 0;

  for (var q = 0; q < fragen.length; q++) {
    var fr = fragen[q];
    var picked = fr._shuffled[selections[q]];
    totalScore += picked.score;

    if (picked.score >= 2) countOk++;
    else if (picked.score === 1) countMeh++;
    else countBad++;
  }

  var perc = Math.round((totalScore / maxScore) * 100);

  var headline = "";
  var level = "";
  var tipp = "";

  if (perc >= 80) {
    headline = "Super!";
    level = "Du machst das richtig gut.";
    tipp = "Du triffst meistens das Gefuehl und gibst Sicherheit. In stressigen Momenten: Stimme runter, kurzer Satz, dann eine kleine Handlung anbieten.";
  } else if (perc >= 55) {
    headline = "Gut!";
    level = "Gute Basis - da geht noch mehr.";
    tipp = "Du bist oft nah dran. Sag fast immer zuerst ein Gefuehl in einfachen Worten (Das macht Sie unruhig / traurig / erschrocken). Dann erst die Loesung.";
  } else {
    headline = "Weiter ueben!";
    level = "Uebung macht den Meister.";
    tipp = "Du rutschst noch oft ins Korrigieren oder Anweisen. Trick: Erst Kontakt + Gefuehl. Dann eine kleine, einfache Handlung anbieten.";
  }

  var reviewHtml = "";
  for (var r = 0; r < fragen.length; r++) {
    var fr2 = fragen[r];
    var picked2 = fr2._shuffled[selections[r]];
    var t = tagForScore(picked2.score);
    var fb = picked2.score === 1 ? ensureMehHint(picked2.feedback) : picked2.feedback;

    reviewHtml += "<div class='review-item'>" +
      "<div class='qtitle'>Frage " + (r + 1) + "</div>" +
      "<div class='small muted'>" + fr2.situation + "</div>" +
      "<div style='margin-top:10px;'>" +
      "<span class='tag " + t.cls + "'>" + t.text + "</span>" +
      "<div style='margin-top:8px;'><strong>Deine Antwort:</strong> " + picked2.text + "</div>" +
      "<div style='margin-top:6px;'>" + fb + "</div>" +
      "<div class='small' style='margin-top:8px;'><strong>Merke:</strong> " + fr2.merksatz + "</div>" +
      "<div class='small' style='margin-top:6px;'><strong>Das kannst du tun:</strong> " + fr2.handlung + "</div>" +
      "</div></div>";
  }

  resultEl.innerHTML =
    "<h2>" + headline + "</h2>" +
    "<p><strong>" + level + "</strong></p>" +
    "<p>" + totalScore + " von " + maxScore + " Punkten (" + perc + "%)</p>" +

    "<div style='background:#fafafa; border:1px solid #ddd; border-radius:10px; padding:14px; margin:16px 0;'>" +
    "<h3 style='margin:0 0 8px 0; font-size:15px;'>Deine Ampel</h3>" +
    "<div class='small'>Gut: <strong>" + countOk + "</strong> &nbsp;|&nbsp; Geht so: <strong>" + countMeh + "</strong> &nbsp;|&nbsp; Nicht gut: <strong>" + countBad + "</strong></div>" +
    "</div>" +

    "<div style='background:#f0f7ff; border:1px solid #b3d4fc; border-radius:10px; padding:14px; margin:16px 0;'>" +
    "<h3 style='margin:0 0 8px 0; font-size:15px;'>Dein Tipp</h3>" +
    "<p style='margin:0; font-size:14px;'>" + tipp + "</p></div>" +

    "<div style='background:#fffef0; border:1px solid #e7d27c; border-radius:10px; padding:14px; margin:16px 0;'>" +
    "<h3 style='margin:0 0 8px 0; font-size:15px;'>Kurz wichtig: Validation ist nicht Luegen</h3>" +
    "<p style='margin:0; font-size:14px;'>Du musst nicht zustimmen. Du nimmst das <strong>Gefuehl</strong> ernst (Angst, Trauer, Unruhe) und gibst Sicherheit. Darum geht’s.</p></div>" +

    "<div style='background:#f5fff5; border:1px solid #6bb36b; border-radius:10px; padding:14px; margin:16px 0;'>" +
    "<h3 style='margin:0 0 8px 0; font-size:15px;'>So geht Validation - 3 Schritte</h3>" +
    "<p style='margin:4px 0; font-size:14px;'><strong>1.</strong> Gefuehl sagen (Das macht Sie unruhig.)</p>" +
    "<p style='margin:4px 0; font-size:14px;'><strong>2.</strong> Sicherheit geben (Ich bin da.)</p>" +
    "<p style='margin:4px 0; font-size:14px;'><strong>3.</strong> Kleine Handlung anbieten (Wir schauen zusammen.)</p></div>" +

    "<div style='background:#fff5f5; border:1px solid #d46a6a; border-radius:10px; padding:14px; margin:16px 0;'>" +
    "<h3 style='margin:0 0 8px 0; font-size:15px;'>Das lieber nicht</h3>" +
    "<ul style='margin:0; padding-left:20px; font-size:14px;'>" +
    "<li>Korrigieren (Das stimmt nicht.)</li>" +
    "<li>Drohen (Wenn Sie nicht...)</li>" +
    "<li>Genervt klingen (Das habe ich doch schon gesagt!)</li>" +
    "<li>Befehlen ohne Kontakt (Setzen Sie sich.)</li></ul></div>" +

    "<details><summary>Alle Antworten nochmal ansehen</summary>" + reviewHtml + "</details>" +
    "<div class='controls' style='margin-top:16px;'><button class='secondary' type='button' id='btnNeu'>Nochmal ueben</button></div>";

  resultEl.style.display = "block";
  resultEl.scrollIntoView({ behavior: "smooth", block: "start" });

  document.getElementById("btnNeu").addEventListener("click", function() {
    location.reload();
  });
});

render();

/* QR-Modal-Logik (wie dein Original) */
var qrFab = document.getElementById('qrFab');
var qrBackdrop = document.getElementById('qrBackdrop');
var qrClose = document.getElementById('qrClose');
var qrCanvas = document.getElementById('qrCanvas');
var qrMade = false;

function openQR() {
  qrBackdrop.style.display = 'flex';
  if (!qrMade) {
    qrCanvas.innerHTML = '';
    new QRCode(qrCanvas, {
      text: window.location.href,
      width: 220,
      height: 220,
      correctLevel: QRCode.CorrectLevel.H
    });
    qrMade = true;
  }
}

function closeQR() {
  qrBackdrop.style.display = 'none';
}

qrFab.addEventListener('click', openQR);
qrClose.addEventListener('click', closeQR);
qrBackdrop.addEventListener('click', function(e) {
  if (e.target === qrBackdrop) closeQR();
});
window.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeQR();
});
</script>

</body>
